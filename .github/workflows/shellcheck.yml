name: Shell Check

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: bash 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n 语法检查
        run: |
          set -e
          for f in build.sh setup-wsl.sh lib/*.sh; do
            echo "== $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck -x build.sh setup-wsl.sh lib/*.sh

      - name: 冒烟测试（--help / --version / doctor）
        run: |
          set -e
          ./build.sh --help >/dev/null
          ./build.sh --version
          # 仓库结构决定 CI 里找不到 KBManager 源码，doctor 仍应正常退出并给出提示
          ./build.sh doctor
